name: Actualizar Playlist IPTV

on:
  schedule:
    - cron: '0 */6 * * *'  # Cada 6 horas
  workflow_dispatch: # Ejecutar manualmente

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testear canales y generar playlist
        run: python testear_canales.py

      - name: Commit y push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add canales_iptv.m3u
          git diff --staged --quiet || (git commit -m "🔄 Playlist actualizada - $(date -u '+%Y-%m-%d %H:%M UTC')" && git push)
